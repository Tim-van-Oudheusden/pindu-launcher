[package]
name = "pindu-ui"
description = "GTK4 and libadwaita shells of Pindu launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pindu-launcher"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_10"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_24"] }
pindu-core.workspace = true
glycin = { version = "4", features = ["gdk4"] }
soup = { package = "soup3", version = "0.9" }
