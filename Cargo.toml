[workspace]
resolver = "3"
members = ["crates/manette", "crates/manette-sys", "crates/pindu-core", "crates/pindu-ui"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/Tim-van-Oudheusden/pindu-launcher"

[workspace.dependencies]
pindu-core = { path = "crates/pindu-core" }

[profile.release]
lto = "thin"

# The Rust for Linux lint set: the kernel's `rust_common_flags` (top-level Makefile), its
# `.clippy.toml` and the rules of Documentation/rust/coding-guidelines.rst that a lint can
# check. CI runs clippy and rustdoc with `-D warnings`, so every warning here fails a build.
# Generated FFI (manette-sys, manette's `auto` module) opts out the way the kernel's
# `bindings` crate does.
[workspace.lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
as_ptr_cast_mut = "warn"
as_underscore = "warn"
cast_lossless = "warn"
ignored_unit_patterns = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
no_mangle_with_rust_abi = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# The kernel's `.clippy.toml` bans `dbg!`.
dbg_macro = "warn"
# Coding guidelines: prefer `#[expect]` to `#[allow]`, and say why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"
