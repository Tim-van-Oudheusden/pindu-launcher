name: Release

# A `v*` tag publishes a GitHub release: the stable Flatpak bundle, its checksums and notes
# from the MetaInfo. A `vX.Y.Z-rc.N` tag publishes a pre-release that is never "latest", so
# a release can soak before its final tag. Running it by hand rebuilds an existing tag's
# release (for example after a failed upload) and replaces its files. docs/releasing.md is
# the runbook.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v0.2.0 or v0.3.0-rc.1
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  MANIFEST: build-aux/flatpak/io.github.tim_van_oudheusden.pindu-launcher.yml
  LINT_EXCEPTIONS: build-aux/flatpak/lint-exceptions.json

jobs:
  version:
    name: Check the tag against the versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Fails before anything is built when the tag, meson.build, Cargo.toml and the
      # MetaInfo's newest <release> disagree, or the release has no notes. A pre-release
      # tag vX.Y.Z-rc.N passes when the files name X.Y.Z-rc.N (meson, Cargo) and X.Y.Z~rcN
      # (MetaInfo, RPM, DEB).
      - id: version
        run: |
          build-aux/check-version.sh "$TAG"
          version="${TAG#v}"
          build-aux/release-notes.py "$version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

  flatpak:
    name: Flatpak bundle, tests and lint (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # As in ci.yml: the GNOME 51 image, the runner's preinstalled SDKs mounted so the build
    # can delete them for disk space, and the image's Flatpak installation on a named volume
    # so updating the SDK does not fail with EXDEV (#150). Each architecture builds natively
    # on a runner of its own (#303).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      volumes:
        - /usr/local/lib/android:/runner-sdks/android
        - /usr/share/dotnet:/runner-sdks/dotnet
        - /opt/hostedtoolcache:/runner-sdks/toolcache
        - /usr/local/.ghcup:/runner-sdks/ghcup
        - flatpak-installation:/var/lib/flatpak
    steps:
      - name: Free disk space
        run: |
          df -h / | tail -1
          rm -rf /runner-sdks/*/*
          df -h / | tail -1

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Runs `meson test` inside the build under xvfb, including the UI smoke test. No
      # cache: a release builds from clean sources.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: pindu-launcher-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak
          artifact-name: flatpak-bundle-${{ matrix.arch }}
          arch: ${{ matrix.arch }}
          branch: stable
          run-tests: true
          cache: false

      - name: Lint the manifest
        run: flatpak-builder-lint --gha-format --exceptions --user-exceptions "$LINT_EXCEPTIONS" manifest "$MANIFEST"

      - name: Lint the build (MetaInfo, desktop file, icons)
        run: flatpak-builder-lint --gha-format --exceptions --user-exceptions "$LINT_EXCEPTIONS" repo repo

  sources:
    name: Source tarball with vendored crates
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install the Rust SDK extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08

      # As in packaging.yml: vendors the crates, then builds and tests the tarball offline.
      - name: meson dist
        run: |
          chown -R "$(id -u):$(id -g)" "$PWD"
          flatpak run --share=network --filesystem="$PWD" --cwd="$PWD" \
            --env=PATH=/usr/lib/sdk/rust-stable/bin:/usr/bin \
            --command=sh org.gnome.Sdk//51 -c '
              set -e
              meson setup _dist
              meson dist -C _dist --formats xztar
            '

      - uses: actions/upload-artifact@v7
        with:
          name: sources
          path: _dist/meson-dist/pindu-launcher-${{ needs.version.outputs.version }}.tar.xz
          if-no-files-found: error

  packages:
    name: Native package (${{ matrix.target }}${{ matrix.suffix }})
    needs: sources
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Distros that ship GTK 4.24 and libadwaita 1.10 (#232), for x86_64 and aarch64 (#303).
    # Each builds offline from the tarball's vendored crates, in its own container, on a
    # runner of its own architecture.
    strategy:
      fail-fast: false
      matrix:
        target: [fedora-45, debian-testing, ubuntu-26.10]
        arch: [x86_64, aarch64]
        include:
          - target: fedora-45
            image: registry.fedoraproject.org/fedora:45
            build: build-aux/rpm/build.sh
          - target: debian-testing
            image: docker.io/library/debian:testing
            build: build-aux/deb/build.sh
          - target: ubuntu-26.10
            image: docker.io/library/ubuntu:26.10
            build: build-aux/deb/build.sh
          # The job names match packaging.yml's.
          - arch: x86_64
            runner: ubuntu-latest
            suffix: ''
          - arch: aarch64
            runner: ubuntu-24.04-arm
            suffix: ', aarch64'
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          name: sources
          path: sources

      - name: Build
        run: ${{ matrix.build }} sources/pindu-launcher-*.tar.xz packages ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}-${{ matrix.arch }}
          path: packages/*
          if-no-files-found: error

  packages-smoke:
    name: Native package install and UI smoke test (${{ matrix.target }}${{ matrix.suffix }})
    needs: packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # A clean container: the package must pull in everything it needs to start.
    strategy:
      fail-fast: false
      matrix:
        target: [fedora-45, debian-testing, ubuntu-26.10]
        arch: [x86_64, aarch64]
        include:
          - target: fedora-45
            image: registry.fedoraproject.org/fedora:45
          - target: debian-testing
            image: docker.io/library/debian:testing
          - target: ubuntu-26.10
            image: docker.io/library/ubuntu:26.10
          - arch: x86_64
            runner: ubuntu-latest
            suffix: ''
          - arch: aarch64
            runner: ubuntu-24.04-arm
            suffix: ', aarch64'
    container:
      image: ${{ matrix.image }}
      # glycin decodes the test cover in a bubblewrap sandbox, which cannot set up its
      # namespaces in an unprivileged container.
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          name: package-${{ matrix.target }}-${{ matrix.arch }}
          path: packages

      - name: Install and start
        run: build-aux/package-smoke.sh packages/*

  # Signs build provenance (SLSA, through Sigstore) for the RPMs, the files Pindu OS installs:
  # `gh attestation verify` then proves that this workflow built them from the tag
  # (docs/releasing.md). It runs before publish, so no release ships an RPM without it.
  provenance:
    name: Build provenance for the RPMs
    needs: packages-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-fedora-*
          merge-multiple: true
          path: packages

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*.rpm

  publish:
    name: Publish the GitHub release
    needs: [version, flatpak, sources, packages-smoke, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          pattern: flatpak-bundle-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: sources
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Checksums and notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          build-aux/release-notes.py "$VERSION" > notes.md

      # A new tag gets a new release; a rerun replaces the files of the existing one. A
      # pre-release tag (vX.Y.Z-rc.N) is published as a pre-release that never becomes the
      # latest release, so the final X.Y.Z stays "latest"; a rerun keeps it that way.
      - name: Publish
        run: |
          flags=()
          case "$TAG" in
            *-rc.*) flags=(--prerelease --latest=false) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$TAG" dist/* --verify-tag --title "Pindu launcher $VERSION" \
              --notes-file notes.md "${flags[@]}"
          fi

  # A final release bumps the AUR and nixpkgs recipes through a pull request of its own, from the
  # published SHA256SUMS (docs/releasing.md, "Distribution recipes"). A pre-release (vX.Y.Z-rc.N)
  # never does: those recipes follow final releases only. A rerun does nothing once main's
  # recipes build the version or the bump pull request is open.
  recipes:
    name: Open the AUR and nixpkgs recipe bump
    needs: [version, publish]
    if: ${{ !contains(needs.version.outputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # Refs the "Release X.Y.Z" issue when there is one, as the bump of #497 did by hand. A pull
      # request opened with GITHUB_TOKEN starts no workflow, so its body asks the maintainer to
      # close and reopen it, which runs the checks.
      - name: Bump the recipes and open the pull request
        run: |
          branch="chore/recipes-$VERSION"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "The bump pull request from $branch is already open."
            exit 0
          fi
          # A final VERSION passed check-version.sh as X.Y.Z, so it is safe inside the jq filter.
          issue="$(gh issue list --state all --search "\"Release $VERSION\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"Release $VERSION\")][0].number // empty")"
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          python3 -I scripts/recipe-bump.py --body "$RUNNER_TEMP/body.md" --summary "$RUNNER_TEMP/summary.md" ${issue:+--issue "$issue"} \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$VERSION" "$RUNNER_TEMP/SHA256SUMS"
          # No body: main's recipes already build this version.
          [ -f "$RUNNER_TEMP/body.md" ] || exit 0
          title="chore(packaging): bump the AUR and nixpkgs recipes to $VERSION${issue:+ (#$issue)}"
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -a -m "$title" -m "From the $TAG release's SHA256SUMS.${issue:+ Refs #$issue}"
          git push --force origin "$branch"
          # The repository setting "Allow GitHub Actions to create and approve pull requests" may be off
          # (#701). The branch is pushed by now, so the job ends green and a person opens the pull request.
          if ! gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"; then
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Actions may not open pull requests here; open $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch by hand (see the run summary)."
          fi
