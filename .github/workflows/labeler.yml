name: Labeler

# Applies path-based area labels from .github/labeler.yml to pull requests.
# pull_request_target runs against the base branch's config so fork pull requests can be
# labelled too; the job never checks out pull request code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read .github/labeler.yml and label the pull request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        # Path labels are a convenience: a failed GitHub API call must not turn this check red.
        continue-on-error: true
