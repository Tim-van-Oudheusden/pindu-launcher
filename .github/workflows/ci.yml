name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LINT_EXCEPTIONS: build-aux/flatpak/lint-exceptions.json

jobs:
  checks:
    name: Rust and Meson checks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust SDK extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08

      - uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            _build/cargo-target
          key: checks-${{ hashFiles('Cargo.lock') }}
          restore-keys: checks-

      # Everything runs in the GNOME 51 SDK, as local builds do. Inside its sandbox root
      # can only write files root owns, and the checkout belongs to the runner's user.
      # The lint set lives in Cargo.toml's [workspace.lints]; `cargo doc` runs its rustdoc lints.
      - name: rustfmt, clippy, rustdoc, unit tests and Meson tests
        run: |
          chown -R "$(id -u):$(id -g)" "$PWD"
          flatpak run --share=network --filesystem="$PWD" --cwd="$PWD" \
            --env=CARGO_HOME="$PWD/.cargo-home" \
            --env=CARGO_TARGET_DIR="$PWD/_build/cargo-target" \
            --env=PATH=/usr/lib/sdk/rust-stable/bin:/usr/bin \
            --command=sh org.gnome.Sdk//51 -c '
              set -e
              cargo fmt --all --check
              cargo clippy --workspace --all-targets -- -D warnings
              RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
              cargo test --workspace
              meson setup --reconfigure _build || meson setup _build
              meson test -C _build --print-errorlogs
              po/check-pot.sh _build
            '

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo-deny 0.20.2, a maintainer-approved tool, with its published SHA-256. It only reads Cargo.lock and
      # `cargo metadata`, which resolves the workspace without the GNOME libraries, so the runner's cargo is enough.
      - name: Install cargo-deny 0.20.2
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz --strip-components=1 \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Advisories, licences, bans and sources, as deny.toml sets them.
      - name: cargo deny check
        run: cargo-deny --locked check

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The repository scripts' own tests; python3, jq and shellcheck come with the runner.
      - name: Python script tests
        run: python3 -m unittest discover -s tests/scripts -v

      - name: Shell script tests
        run: sh scripts/nightly-compliance.test.sh

      - name: shellcheck
        run: shellcheck scripts/*.sh

  sources:
    name: Source tarball with vendored crates
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust SDK extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08

      # `meson dist` vendors the crates into the tarball (build-aux/dist-vendor.sh), then
      # builds and tests the tarball offline from them, as a distro builder would.
      - name: meson dist
        run: |
          chown -R "$(id -u):$(id -g)" "$PWD"
          flatpak run --share=network --filesystem="$PWD" --cwd="$PWD" \
            --env=PATH=/usr/lib/sdk/rust-stable/bin:/usr/bin \
            --command=sh org.gnome.Sdk//51 -c '
              set -e
              meson setup _dist
              meson dist -C _dist --formats xztar
            '

      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: _dist/meson-dist/*.tar.xz
          if-no-files-found: error

  packages:
    name: Native package (${{ matrix.target }})
    needs: sources
    runs-on: ubuntu-latest
    # Distros that ship GTK 4.24 and libadwaita 1.10 (#232). Each builds offline from the
    # tarball's vendored crates, in its own container.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fedora-45
            image: registry.fedoraproject.org/fedora:45
            build: build-aux/rpm/build.sh
          - target: debian-testing
            image: docker.io/library/debian:testing
            build: build-aux/deb/build.sh
          - target: ubuntu-26.10
            image: docker.io/library/ubuntu:26.10
            build: build-aux/deb/build.sh
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: sources

      - name: Build
        run: ${{ matrix.build }} sources/pindu-launcher-*.tar.xz packages ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: packages/*
          if-no-files-found: error

  packages-smoke:
    name: Native package install and UI smoke test (${{ matrix.target }})
    needs: packages
    runs-on: ubuntu-latest
    # A clean container: the package must pull in everything it needs to start.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fedora-45
            image: registry.fedoraproject.org/fedora:45
          - target: debian-testing
            image: docker.io/library/debian:testing
          - target: ubuntu-26.10
            image: docker.io/library/ubuntu:26.10
    container:
      image: ${{ matrix.image }}
      # glycin decodes the test cover in a bubblewrap sandbox, which cannot set up its
      # namespaces in an unprivileged container.
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: packages

      - name: Install and start
        run: build-aux/package-smoke.sh packages/*

  flatpak:
    name: Flatpak build, UI smoke test and lint (${{ matrix.profile }})
    runs-on: ubuntu-latest
    # The release manifest builds on every pull request too, so a broken one fails here and
    # not when a release is tagged.
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: development
            manifest: build-aux/flatpak/io.github.tim_van_oudheusden.pindu-launcher-devel.yml
            bundle: pindu-launcher-devel.flatpak
          - profile: release
            manifest: build-aux/flatpak/io.github.tim_van_oudheusden.pindu-launcher.yml
            bundle: pindu-launcher.flatpak
    env:
      MANIFEST: ${{ matrix.manifest }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      volumes:
        # The runner's preinstalled SDKs, mounted so the build can delete them: the image
        # and a release build of the app do not fit in the disk space left otherwise.
        - /usr/local/lib/android:/runner-sdks/android
        - /usr/share/dotnet:/runner-sdks/dotnet
        - /opt/hostedtoolcache:/runner-sdks/toolcache
        - /usr/local/.ghcup:/runner-sdks/ghcup
        # The image's system installation, copied by Docker into a new named volume (#150).
        # Updating a runtime renames its old deployment directory, and on runners whose
        # overlayfs has redirect_dir off, renaming a directory from an image layer fails
        # with EXDEV ("Invalid cross-device link"). On a volume it is a plain rename.
        - flatpak-installation:/var/lib/flatpak
    steps:
      - name: Free disk space
        run: |
          df -h / | tail -1
          rm -rf /runner-sdks/*/*
          df -h / | tail -1

      - uses: actions/checkout@v7

      # Runs `meson test` inside the build, under xvfb, after the install: this is
      # where the UI smoke test runs. The bundle is uploaded as an artifact.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ matrix.manifest }}
          bundle: ${{ matrix.bundle }}
          run-tests: true
          cache-key: flatpak-builder-${{ matrix.profile }}-${{ github.sha }}

      # Blocking. The local exceptions only cover the importers' read-only access to
      # other launchers' data, which the spec needs, and what a private dev build
      # cannot satisfy; each one says why.
      - name: Lint the manifest
        run: flatpak-builder-lint --gha-format --exceptions --user-exceptions "$LINT_EXCEPTIONS" manifest "$MANIFEST"

      - name: Lint the build (MetaInfo, desktop file, icons)
        run: flatpak-builder-lint --gha-format --exceptions --user-exceptions "$LINT_EXCEPTIONS" repo repo
