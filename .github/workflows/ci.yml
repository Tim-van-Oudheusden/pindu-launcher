name: CI

# The checks every pull request waits for, all of them required (.github/rulesets/main.json):
# rustfmt, clippy, rustdoc, the unit and Meson tests, a check with the declared minimum Rust
# version, the dependency policy, the scripts' tests and the development Flatpak build on x86_64
# with its UI smoke test. The slow builds (the source tarball, the native packages, the release
# and aarch64 Flatpaks) run after the merge in packaging.yml (#362).

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue starts CI on main after each merge (scripts/merge-queue.sh): a merge made
  # with GITHUB_TOKEN starts no push run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LINT_EXCEPTIONS: build-aux/flatpak/lint-exceptions.json

jobs:
  governance:
    name: Governance scripts and policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The PR review rubric, the risk-tier classifier against .github/risk-assessment.yml and
      # docs/risk-tiers.md, and every workflow's token grants against
      # .github/policies/workflow-permissions.yml (yq 4 ships on the runner).
      - name: Script tests
        run: |
          sh scripts/pr-review-check.test.sh
          sh scripts/tier-classify.test.sh
          sh scripts/workflow-permissions-check.test.sh

  checks:
    name: Rust and Meson checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust SDK extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08

      - uses: actions/cache@v6
        id: cargo-cache
        with:
          path: |
            .cargo-home
            _build/cargo-target
          key: checks-${{ hashFiles('Cargo.lock') }}
          restore-keys: checks-

      # Everything runs in the GNOME 51 SDK, as local builds do. Inside its sandbox root
      # can only write files root owns, and the checkout belongs to the runner's user.
      # The lint set lives in Cargo.toml's [workspace.lints]; `cargo doc` runs its rustdoc lints.
      # python-dbusmock (approved 2026-11-17), with the dbus-python it needs, is installed
      # into the build folder for the system panel's tests against NetworkManager, BlueZ and
      # logind templates (crates/pindu-ui/tests/system_panel); without it they skip.
      # A cache restored from another Cargo.lock (restore-keys) holds the workspace crates built
      # against it, under hashes no later build uses; cleaning them keeps the cache saved at the
      # end of this run to the dependencies and one build of the workspace.
      - name: rustfmt, clippy, rustdoc, unit tests and Meson tests
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          chown -R "$(id -u):$(id -g)" "$PWD"
          # shellcheck disable=SC2016 # $CARGO_CACHE_HIT expands in the SDK's shell, not this one
          flatpak run --share=network --filesystem="$PWD" --cwd="$PWD" \
            --env=CARGO_HOME="$PWD/.cargo-home" \
            --env=CARGO_TARGET_DIR="$PWD/_build/cargo-target" \
            --env=CARGO_CACHE_HIT="$CARGO_CACHE_HIT" \
            --env=PATH=/usr/lib/sdk/rust-stable/bin:/usr/bin \
            --env=PYTHONPATH="$PWD/_build/python" \
            --command=sh org.gnome.Sdk//51 -c '
              set -e
              if [ "$CARGO_CACHE_HIT" != true ]; then
                cargo clean --workspace
              fi
              python3 -m pip install --no-cache-dir --target _build/python \
                python-dbusmock==0.38.1 dbus-python==1.5.1
              cargo fmt --all --check
              cargo clippy --workspace --all-targets -- -D warnings
              RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
              cargo test --workspace
              meson setup --reconfigure _build || meson setup _build
              meson test -C _build --print-errorlogs
              po/check-pot.sh _build
            '

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Cargo.toml's rust-version is the floor the README, CONTRIBUTING, the RPM spec and the
      # Debian control promise (#449). Every other job builds with the SDK's rust-stable, so only
      # this job notices when the code needs a newer compiler; it reads the version from
      # Cargo.toml, so raising the floor moves the check with it. The toolchain comes from
      # rustup-init 1.29.3 with its published SHA-256, in the GNOME 51 SDK as `checks` builds.
      - name: cargo check with the declared rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          mkdir -p _build
          chown -R "$(id -u):$(id -g)" "$PWD"
          # shellcheck disable=SC2016 # $MSRV expands in the SDK's shell, not this one
          flatpak run --share=network --filesystem="$PWD" --cwd="$PWD" \
            --env=MSRV="$msrv" \
            --env=RUSTUP_HOME="$PWD/_build/msrv-rustup" \
            --env=CARGO_HOME="$PWD/_build/msrv-cargo" \
            --env=CARGO_TARGET_DIR="$PWD/_build/msrv-target" \
            --env=PATH="$PWD/_build/msrv-cargo/bin:/usr/bin" \
            --command=sh org.gnome.Sdk//51 -c '
              set -e
              curl -fsSLo _build/rustup-init \
                https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-linux-gnu/rustup-init
              echo "b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55  _build/rustup-init" \
                | sha256sum -c -
              chmod +x _build/rustup-init
              _build/rustup-init -y --no-modify-path --profile minimal --default-toolchain "$MSRV"
              cargo --version
              cargo check --workspace --all-targets --locked
            '

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # cargo-deny 0.20.2, a maintainer-approved tool, with its published SHA-256. It only reads Cargo.lock and
      # `cargo metadata`, which resolves the workspace without the GNOME libraries, so the runner's cargo is enough.
      - name: Install cargo-deny 0.20.2
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz --strip-components=1 \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Advisories, licences, bans and sources, as deny.toml sets them.
      - name: cargo deny check
        run: cargo-deny --locked check

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The repository scripts' own tests; python3, jq and shellcheck come with the runner.
      - name: Python script tests
        run: python3 -m unittest discover -s tests/scripts -v

      - name: Shell script tests
        run: |
          sh scripts/nightly-compliance.test.sh
          sh scripts/needs-build.test.sh
          sh scripts/packaging-issue.test.sh
          sh scripts/ai-extent.test.sh

      - name: shellcheck
        run: shellcheck scripts/*.sh

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request that only changes documentation or translations skips the Flatpak build
      # (scripts/needs-build.sh); a skipped job passes as a required check. Pushes and manual
      # runs always build.
      - name: Does the change need the Flatpak build?
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ -z "$BASE_SHA" ]; then
            echo build=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c core.quotePath=false diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}" \
            | sh scripts/needs-build.sh | tee -a "$GITHUB_OUTPUT"

  flatpak:
    name: Flatpak build, UI smoke test and lint (development)
    needs: changes
    # Only an answer of `false` skips the build: if `changes` failed, the build still runs.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The development manifest on x86_64; packaging.yml builds the release manifest and both on
    # aarch64 after the merge. Not a matrix: a skipped matrix job reports its name unexpanded,
    # so the required check would never pass.
    env:
      MANIFEST: build-aux/flatpak/io.github.tim_van_oudheusden.pindu-launcher-devel.yml
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      volumes:
        # The runner's preinstalled SDKs, mounted so the build can delete them: the image
        # and a release build of the app do not fit in the disk space left otherwise.
        - /usr/local/lib/android:/runner-sdks/android
        - /usr/share/dotnet:/runner-sdks/dotnet
        - /opt/hostedtoolcache:/runner-sdks/toolcache
        - /usr/local/.ghcup:/runner-sdks/ghcup
        # The image's system installation, copied by Docker into a new named volume (#150).
        # Updating a runtime renames its old deployment directory, and on runners whose
        # overlayfs has redirect_dir off, renaming a directory from an image layer fails
        # with EXDEV ("Invalid cross-device link"). On a volume it is a plain rename.
        - flatpak-installation:/var/lib/flatpak
    steps:
      - name: Free disk space
        run: |
          df -h / | tail -1
          rm -rf /runner-sdks/*/*
          df -h / | tail -1

      - uses: actions/checkout@v7

      # Runs `meson test` inside the build, under xvfb, after the install: this is
      # where `cargo test` and the UI smoke test run. The bundle is uploaded as the
      # artifact pindu-launcher[-devel]-<arch>.flatpak.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: pindu-launcher-devel.flatpak
          arch: x86_64
          run-tests: true

      # Blocking. The local exceptions only cover the importers' read-only access to
      # other launchers' data, which the spec needs, and what a private dev build
      # cannot satisfy; each one says why.
      - name: Lint the manifest
        run: flatpak-builder-lint --gha-format --exceptions --user-exceptions "$LINT_EXCEPTIONS" manifest "$MANIFEST"

      - name: Lint the build (MetaInfo, desktop file, icons)
        run: flatpak-builder-lint --gha-format --exceptions --user-exceptions "$LINT_EXCEPTIONS" repo repo

  merge-queue:
    name: Merge queue script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # scripts/merge-queue.sh against a stub gh and throwaway repositories, and
      # .github/workflows/merge-queue.yml against the script (jq and yq 4 ship on the runner).
      - name: Script tests
        run: sh scripts/merge-queue.test.sh
