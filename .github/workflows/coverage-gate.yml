name: Coverage gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run per pull request; pushes to main get a group per commit, so none is cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Unit-test coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the Rust SDK extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08

      - uses: actions/cache@v6
        with:
          path: |
            .cargo-home
            _build/cargo-target
          key: coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: coverage-

      # The floor check and the scripts of the weekly reports and of /apply-suggestions, which have
      # no pull request trigger of their own.
      - name: Test the scripts
        run: |
          sh scripts/coverage-check.test.sh
          sh scripts/auto-qa-tuner.test.sh
          sh scripts/quality-report.test.sh
          sh scripts/pr-metrics.test.sh
          sh scripts/ai-audit-report.test.sh
          sh scripts/apply-review-suggestions.test.sh
          sh scripts/strategy-report.test.sh

      # In the GNOME 51 SDK, as the checks job in ci.yml. cargo-llvm-cov finds llvm-cov and
      # llvm-profdata in the rust-stable extension's sysroot (lib/rustlib/<host>/bin). Branch
      # coverage needs a nightly compiler, so lines, regions and functions are measured.
      # pindu-ui is GTK code, covered by the UI smoke test instead. `cargo llvm-cov report` writes
      # the line-level lcov.info from the same run's profile data, without running the tests again.
      - name: Measure pindu-core coverage
        run: |
          chown -R "$(id -u):$(id -g)" "$PWD"
          flatpak run --share=network --filesystem="$PWD" --cwd="$PWD" \
            --env=CARGO_HOME="$PWD/.cargo-home" \
            --env=CARGO_TARGET_DIR="$PWD/_build/cargo-target" \
            --env=PATH="$PWD/.cargo-home/bin:/usr/lib/sdk/rust-stable/bin:/usr/bin" \
            --command=sh org.gnome.Sdk//51 -c '
              set -e
              cargo install --locked cargo-llvm-cov --version 0.9.1
              cargo llvm-cov --package pindu-core --json --summary-only --output-path coverage.json
              cargo llvm-cov report --package pindu-core --lcov --output-path lcov.info
            '

      # The floors and the tuner's margin live in .github/auto-qa-tuning.json.
      - name: Check coverage floors
        run: scripts/coverage-check.sh coverage.json .github/auto-qa-tuning.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.json
            lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # An aggregate floor cannot fail on one new branch that no test asserts (#346, #450, #485).
  # cargo-mutants mutates only the pindu-core lines this pull request changes, and a mutant that
  # survives the tests on a changed line fails the job; survivors already on main block nothing.
  # A pull request without a pindu-core change passes at once. No `paths:` filter: a
  # filtered-out run of a required check would block the merge instead of skipping.
  # On a push to main it mutates nothing: it fills the cache that every pull request restores.
  # A pull request's own cache entry is readable by that pull request alone.
  mutants:
    name: Mutants in changed pindu-core code
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # One mutant takes about 8 s here, run one at a time; #838's 208 mutants needed more than 30 min.
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the Rust SDK extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08

      # Under the ignored _build/, so cargo-mutants' copy of the tree leaves them out.
      - uses: actions/cache@v6
        id: mutants-cache
        with:
          path: |
            _build/cargo-home
            _build/cargo-target
          key: mutants-${{ hashFiles('Cargo.lock') }}
          restore-keys: mutants-

      # Only on a Cargo.lock main has no entry for yet: an exact hit is not saved again. The build is
      # cargo-mutants' own build step (`cargo test --no-run`, no extra RUSTFLAGS without
      # --cap-lints), so a pull request reuses these dependency builds. A cache restored from another
      # Cargo.lock holds workspace crates built against it; cleaning them keeps the entry small.
      - name: Fill the cache for pull requests
        if: github.event_name == 'push' && steps.mutants-cache.outputs.cache-hit != 'true'
        run: |
          chown -R "$(id -u):$(id -g)" "$PWD"
          flatpak run --share=network --filesystem="$PWD" --cwd="$PWD" \
            --env=CARGO_HOME="$PWD/_build/cargo-home" \
            --env=CARGO_TARGET_DIR="$PWD/_build/cargo-target" \
            --env=PATH="$PWD/_build/cargo-home/bin:/usr/lib/sdk/rust-stable/bin:/usr/bin" \
            --command=sh org.gnome.Sdk//51 -c '
              set -e
              cargo clean --workspace
              cargo install --locked cargo-mutants --version 27.1.0
              cargo test --package pindu-core --no-run
            '

      # The checkout is the pull request merged into its base, so the diff from the base is the
      # pull request's own change.
      - name: Mutate the changed pindu-core lines
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$PWD"
          mkdir -p _build
          git diff "$BASE...HEAD" -- crates/pindu-core > _build/pr.diff
          if [ ! -s _build/pr.diff ]; then
            echo "No pindu-core change."
            exit 0
          fi
          chown -R "$(id -u):$(id -g)" "$PWD"
          flatpak run --share=network --filesystem="$PWD" --cwd="$PWD" \
            --env=CARGO_HOME="$PWD/_build/cargo-home" \
            --env=CARGO_TARGET_DIR="$PWD/_build/cargo-target" \
            --env=PATH="$PWD/_build/cargo-home/bin:/usr/lib/sdk/rust-stable/bin:/usr/bin" \
            --command=sh org.gnome.Sdk//51 -c '
              set -e
              cargo install --locked cargo-mutants --version 27.1.0
              cargo mutants --package pindu-core --in-diff _build/pr.diff --output _build
            '

      - name: Upload mutants report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: _build/mutants.out
          if-no-files-found: ignore
          retention-days: 14
