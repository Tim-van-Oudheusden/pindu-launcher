name: Bug report
description: Something in Pindu launcher does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Keep the title short and specific, e.g. "Steam games on a second drive are missing".
        Please leave out personal data such as account names, keys or full home paths you would rather not share.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does it go wrong, if you know?
      multiple: true
      options:
        - Importing games from a launcher (area:import)
        - Desktop or fullscreen window (area:ui)
        - Launching games or playtime (area:launch)
        - Artwork (area:art)
        - Controller input (area:gamepad)
        - Installing or packaging (area:packaging)
        - Library data or settings (area:core)
        - Not sure
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Pindu launcher
        2. ...
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Did it do any of these?
      description: >-
        Helps triage spot the bugs that must be fixed before 1.0. Pick every one that happened, or None of these.
      multiple: true
      options:
        - Lost data (games, collections, playtime, settings or saves are gone or wrong)
        - Broke a group (copies of one game are no longer grouped, or different games were grouped)
        - Left a game launching with no way out (stuck on starting, or the launcher cannot be reached)
        - None of these
        - Not sure
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      multiple: false
      options:
        - Flatpak from a GitHub release
        - RPM package
        - DEB package
        - Pindu OS
        - AUR or nixpkgs package
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: debug-info
    attributes:
      label: Debugging information
      description: >-
        Paste the app's debugging information report. It has the version, how the app was installed, your distribution
        and session, each game source's state and game count, and the tools it found, with no game titles and no home
        paths. On the desktop, open the main menu, choose About Pindu launcher, then Troubleshooting, then Debugging
        Information, and use Copy (or Save and attach the file). In fullscreen mode, open Quick Access (R3 or the
        Deck's … button) and open the diagnostics report: it shows the report in pages to photograph and saves a copy
        in `~/.local/share/pindu-launcher/reports/` (in the Flatpak,
        `~/.var/app/io.github.tim_van_oudheusden.pindu-launcher/data/pindu-launcher/reports/`). If the app does not
        start at all, give its version, your distribution and desktop instead.
      placeholder: |
        Pindu launcher 0.1.0
        App ID: io.github.tim_van_oudheusden.pindu-launcher
        Installed as: ...
        ...
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Optional. Run `flatpak run io.github.tim_van_oudheusden.pindu-launcher` (or `pindu-launcher`) from a terminal,
        reproduce the bug and paste the output.
      render: text
