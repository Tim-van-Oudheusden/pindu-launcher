# Policy: what GITHUB_TOKEN may do in each workflow.
# Evaluated by scripts/workflow-permissions-check.sh, which CI runs through
# scripts/workflow-permissions-check.test.sh: it fails when a workflow under
# .github/workflows/ has no rule here, when a rule names a workflow or job that does not
# exist or has a key other than `jobs`, or when a workflow's `permissions:` blocks differ
# from its rule in either direction.
#
# Every workflow declares a top-level `permissions:` block equal to `default`, so a job
# without its own block can only read the repository. A rule is:
#   jobs  the exact `permissions:` block of each job that declares one. A job's block
#         replaces the top-level one; jobs not listed must not declare a block.
# A rule of `{}` means the default and no job-level blocks.
#
# Widening a grant is a change to this file and to the workflow, both high risk
# (docs/risk-tiers.md), so the maintainer reviews and merges it.

default:
  contents: read

workflows:
  # Weekly report of which agent and model are behind each merged pull request.
  ai-audit.yml:
    jobs:
      audit: { contents: read, pull-requests: read }

  # Opens, updates and closes the nightly compliance issue from the run's report artifact.
  auto-issues.yml:
    jobs:
      compliance-issue: { actions: read, contents: read, issues: write }

  # Commits review suggestion blocks to the pull request's branch on /apply-suggestions.
  auto-review.yml:
    jobs:
      apply: { contents: write, pull-requests: write }

  ci.yml: {}

  # Claude Code pushes `claude/*` branches, opens pull requests and answers on issues;
  # id-token is the action's OIDC exchange.
  claude.yml:
    jobs:
      claude: { contents: write, id-token: write, issues: write, pull-requests: write }

  coverage-gate.yml: {}

  # actions/labeler reads .github/labeler.yml and labels the pull request.
  labeler.yml:
    jobs:
      label: { contents: read, pull-requests: write }

  # pick reads pull requests; land merges, closes issues and starts main's workflows;
  # reject labels `hold`, comments and starts the next queue run.
  merge-queue.yml:
    jobs:
      pick: { contents: read, pull-requests: read }
      land: { actions: write, contents: write, issues: write, pull-requests: write }
      reject: { actions: write, contents: read, issues: write, pull-requests: write }

  # Reads Dependabot alerts for the supply-chain row.
  nightly-compliance.yml:
    jobs:
      compliance: { contents: read, vulnerability-alerts: read }

  pr-metrics.yml:
    jobs:
      acceptance: { contents: read, pull-requests: read }

  quality-report.yml: {}

  # Create the GitHub Release and upload the bundles, sources and packages.
  release.yml:
    jobs:
      publish: { contents: write }

  review.yml: {}

  strategy-report.yml:
    jobs:
      report: { contents: read, issues: read, pull-requests: read }

  tier-classifier.yml: {}
