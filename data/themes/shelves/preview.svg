<?xml version="1.0" encoding="UTF-8"?>
<!-- Shelves' Home, as a schematic for its card in Quick Access: the focused game's art at
     the top with its title and details, then every section as a row of covers, the row
     with focus at the top and its focused card under a white ring, the others dimmed. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 160 100">
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="1" stop-color="#3b2a3a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0e12" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
  </defs>
  <rect width="160" height="100" fill="#0d0e12"/>
  <rect width="160" height="50" fill="url(#art)"/>
  <rect y="20" width="160" height="30" fill="url(#fade)"/>
  <rect x="8" y="7" width="14" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="8" y="11.5" width="14" height="1" fill="#ffffff"/>
  <rect x="26" y="7" width="14" height="3" rx="1.5" fill="#ffffff" opacity="0.8"/>
  <rect x="140" y="7" width="12" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="8" y="22" width="40" height="6" rx="2" fill="#ffffff"/>
  <rect x="8" y="31" width="14" height="4" rx="2" fill="#14141a" opacity="0.8"/>
  <rect x="25" y="31" width="18" height="4" rx="2" fill="#14141a" opacity="0.8"/>
  <rect x="8" y="44" width="16" height="22" rx="2.5" fill="#2a2c33"/>
  <rect x="8" y="44" width="16" height="22" rx="2.5" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <rect x="28" y="44" width="16" height="22" rx="2.5" fill="#1c1d21"/>
  <rect x="48" y="44" width="16" height="22" rx="2.5" fill="#1c1d21"/>
  <rect x="68" y="44" width="16" height="22" rx="2.5" fill="#1c1d21"/>
  <rect x="88" y="44" width="16" height="22" rx="2.5" fill="#1c1d21"/>
  <rect x="108" y="44" width="16" height="22" rx="2.5" fill="#1c1d21"/>
  <rect x="128" y="44" width="16" height="22" rx="2.5" fill="#1c1d21"/>
  <rect x="148" y="44" width="16" height="22" rx="2.5" fill="#1c1d21"/>
  <g opacity="0.45">
    <rect x="8" y="72" width="20" height="2.5" rx="1.25" fill="#ffffff"/>
    <rect x="8" y="77" width="16" height="22" rx="2.5" fill="#1c1d21"/>
    <rect x="28" y="77" width="16" height="22" rx="2.5" fill="#1c1d21"/>
    <rect x="48" y="77" width="16" height="22" rx="2.5" fill="#1c1d21"/>
    <rect x="68" y="77" width="16" height="22" rx="2.5" fill="#1c1d21"/>
    <rect x="88" y="77" width="16" height="22" rx="2.5" fill="#1c1d21"/>
    <rect x="108" y="77" width="16" height="22" rx="2.5" fill="#1c1d21"/>
    <rect x="128" y="77" width="16" height="22" rx="2.5" fill="#1c1d21"/>
    <rect x="148" y="77" width="16" height="22" rx="2.5" fill="#1c1d21"/>
  </g>
</svg>
