<?xml version="1.0" encoding="UTF-8"?>
<!-- Marquee's Home, drawn as a schematic for Quick Access's Design cards: the focused
     game's art across the screen under its shade, the title and details above a row of
     small squares along the bottom, then a divider and the section tiles. No text, art
     or logos: the art is a plain wash. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 160 100">
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4150"/>
      <stop offset="0.55" stop-color="#5a5f6e"/>
      <stop offset="1" stop-color="#2b2f38"/>
    </linearGradient>
    <linearGradient id="shade-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0c0f" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#0b0c0f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c0f" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#0b0c0f" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#0b0c0f" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0c0f" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="160" height="100" fill="#0b0c0f"/>
  <rect width="160" height="100" fill="url(#art)"/>
  <circle cx="118" cy="34" r="22" fill="#7a7f8c" fill-opacity="0.35"/>
  <rect width="160" height="100" fill="url(#shade-left)"/>
  <rect width="160" height="100" fill="url(#shade-bottom)"/>
  <!-- Top bar: the page tabs, the shown one underlined, and the clock -->
  <rect x="9" y="6" width="11" height="3" rx="1" fill="#ffffff"/>
  <rect x="9" y="10.5" width="11" height="0.8" fill="#ffffff"/>
  <rect x="24" y="6" width="11" height="3" rx="1" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="140" y="6" width="11" height="3" rx="1" fill="#ffffff"/>
  <!-- The focused game's title and details -->
  <rect x="9" y="50" width="44" height="7" rx="2" fill="#ffffff"/>
  <rect x="9" y="60" width="30" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.8"/>
  <!-- The row of square cards, the first grown under a white ring, then a divider and the
       section tiles -->
  <rect x="9" y="70" width="21" height="21" rx="2.5" fill="#1a1b1f" stroke="#ffffff" stroke-width="1.5"/>
  <g fill="#1a1b1f" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.6">
    <rect x="34" y="74" width="17" height="17" rx="2"/>
    <rect x="55" y="74" width="17" height="17" rx="2"/>
    <rect x="76" y="74" width="17" height="17" rx="2"/>
  </g>
  <rect x="97.5" y="76" width="0.8" height="13" fill="#ffffff" fill-opacity="0.5"/>
  <g fill="#14141a" fill-opacity="0.78">
    <rect x="103" y="74" width="17" height="17" rx="2"/>
    <rect x="124" y="74" width="17" height="17" rx="2"/>
    <rect x="145" y="74" width="17" height="17" rx="2"/>
  </g>
</svg>
